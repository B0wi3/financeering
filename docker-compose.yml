version: '3.8'
services:
  mysql:
    container_name: financeering-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd}
      MYSQL_DATABASE: financeering
      MYSQL_USER: ${MYSQL_USER:-finance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finance_pwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  keycloak:
    container_name: financeering-keycloak
    image: quay.io/keycloak/keycloak:22.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-financepwd}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      - mysql
volumes:
  mysql_data:
  keycloak_data: