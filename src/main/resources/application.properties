spring.application.name=financeering
server.port=8081

# MySQL Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeering}
spring.datasource.username=${MYSQL_USER:finance}
spring.datasource.password=${MYSQL_PASSWORD:finance_pwd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/financeering}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/financeering/protocol/openid-connect/certs}
